<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GrowLab Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.status{font-size:12px;color:#8b949e}
.status.ok{color:#3fb950}
.status.err{color:#d29922}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.stage img{max-width:100%;max-height:100%;display:block}
</style>
</head>
<body>
<div class="topbar">
  <h1>GrowLab Live</h1>
  <div class="spacer"></div>
  <span id="status" class="status">Connecting...</span>
</div>
<div class="stage">
  <img id="feed" alt="Live camera">
</div>
<script>
const img = document.getElementById('feed');
const status = document.getElementById('status');
function tick(){
  img.src = '/frame?t=' + Date.now();
}
img.onload = () => { status.textContent = 'Live'; status.className = 'status ok'; };
img.onerror = () => { status.textContent = 'Waiting for camera...'; status.className = 'status err'; };
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
