<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>{% block title %}GrowLab{% endblock %}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--input:#0d1117}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;padding:0;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:600}
.topbar .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px 12px}
.card h2{font-size:16px;margin-bottom:8px;color:var(--fg)}
.card h3{font-size:14px;margin-bottom:6px;color:var(--dim)}
.metric{display:inline-block;text-align:center;padding:6px 12px}
.metric .val{font-size:22px;font-weight:700;font-family:'Courier New',monospace}
.metric .lbl{font-size:11px;color:var(--dim);text-transform:uppercase}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
.badge.green{background:#1a3a2a;color:var(--green)}
.badge.red{background:#3a1a1a;color:var(--red)}
.badge.orange{background:#3a2a1a;color:var(--orange)}
.badge.blue{background:#1a2a3a;color:var(--accent)}
.btn{display:inline-block;padding:10px 18px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.secondary{background:var(--border);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.grid .item{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.grid .item img{width:100%;height:120px;object-fit:cover;display:block}
.grid .item .info{padding:8px}
.grid .item .info .name{font-size:13px;font-weight:600}
.grid .item .info .sub{font-size:11px;color:var(--dim)}
.list{list-style:none}
.list li{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.list li:active{background:var(--border)}
.list .count{font-size:12px;color:var(--dim);margin-left:auto}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);padding:0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a{padding:10px 16px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a.active{color:var(--accent);border-bottom-color:var(--accent)}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px}
.photo-grid .photo{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:4/3}
.photo-grid .photo img{width:100%;height:100%;object-fit:cover}
.photo-grid .photo .filename{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 4px}
.date-header{padding:8px 12px;font-weight:700;font-size:14px;color:var(--accent);background:var(--bg)}
input,select,textarea{background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;width:100%}
label{font-size:12px;color:var(--dim);margin-bottom:4px;display:block}
.empty{text-align:center;padding:40px;color:var(--dim)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100}
.nav a{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--dim)}
.nav a.active{color:var(--accent)}
.nav a .icon{font-size:20px;display:block}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress .bar{height:100%;background:var(--accent);transition:width .3s}
</style>
</head>
<body>
{% block content %}{% endblock %}
<nav class="nav">
  <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}"><span class="icon">&#127968;</span>Home</a>
  <a href="/timelapse" class="{% if 'timelapse' in request.path %}active{% endif %}"><span class="icon">&#127909;</span>Timelapse</a>
  <a href="/charts" class="{% if request.endpoint == 'charts' %}active{% endif %}"><span class="icon">&#128200;</span>Charts</a>
  <a href="/settings" class="{% if request.endpoint == 'settings' %}active{% endif %}"><span class="icon">&#9881;</span>Settings</a>
</nav>
</body>
</html>
