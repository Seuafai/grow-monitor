<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Position Recognizer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .drop { border: 2px dashed #999; border-radius: 8px; padding: 3rem 1rem; text-align: center; cursor: pointer; }
  .drop.active { border-color: #3b82f6; background: #eff6ff; }
  input[type=file] { display: none; }
  button { padding: .6rem 1.2rem; font-size: 1rem; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .status { margin-top: 1rem; }
  .hint { color: #666; font-size: .9rem; }
</style>
</head>
<body>
  <h1>Chess Position Recognizer</h1>
  <p class="hint">Upload a PDF or photos of chess book pages. The positions are read
  automatically; you review and correct them on the next screen, then download a PGN
  for ChessBase.</p>

  <div class="drop" id="drop">
    <p><strong>Click to choose files</strong> or drag them here.</p>
    <p class="hint">PDF pages or images (PNG/JPG).</p>
  </div>
  <input type="file" id="file" multiple accept=".pdf,.png,.jpg,.jpeg">

  <div class="status" id="status"></div>
  <button class="primary" id="go" style="margin-top:1rem; display:none;">Start reading</button>

<script>
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const status = document.getElementById('status');
const go = document.getElementById('go');
let chosen = [];

drop.addEventListener('click', () => file.click());
file.addEventListener('change', () => { chosen = [...file.files]; showChosen(); });

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('active'); });
drop.addEventListener('dragleave', () => drop.classList.remove('active'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('active');
  chosen = [...e.dataTransfer.files].filter(f => /\.(pdf|png|jpe?g)$/i.test(f.name));
  showChosen();
});

function showChosen() {
  status.textContent = chosen.length ? `${chosen.length} file(s) selected: ${chosen.map(f => f.name).join(', ')}` : '';
  go.style.display = chosen.length ? '' : 'none';
}

go.addEventListener('click', async () => {
  const fd = new FormData();
  chosen.forEach(f => fd.append('files', f));
  go.disabled = true; go.textContent = 'Reading positions…';
  const r = await fetch('/process', { method: 'POST', body: fd });
  const d = await r.json();
  if (d.error) { status.textContent = 'Error: ' + d.error; go.disabled = false; go.textContent = 'Start reading'; return; }
  location.href = '/view/' + d.session_id;
});
</script>
</body>
</html>
